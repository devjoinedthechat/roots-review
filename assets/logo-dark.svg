  <path d="M48 36 V62 M48 44 C48 52 38 52 35 60 M48 44 C48 52 58 52 61 60" stroke="#e6edf3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="35" cy="61" r="4.5" fill="#e6edf3"/>
  <circle cx="61" cy="61" r="4.5" fill="#e6edf3"/>
  <circle cx="48" cy="65" r="4.5" fill="#e6edf3"/>
  <!-- the handle, in Bitcoin orange -->
  <path d="M72 70 L95 93" stroke="#f7931a" stroke-width="9" stroke-linecap="round"/>
</svg>
