name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile every source file
        run: python -I -m compileall -q roots_review mcp_server.py run_tests.py roots-review tests
      - name: Unit tests
        run: python -I run_tests.py

  integration:
    name: integration (build, stdio, HTTP, determinism)
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Restore the fetch cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .work
          key: work-${{ hashFiles('config.json') }}-${{ github.run_id }}
          restore-keys: work-${{ hashFiles('config.json') }}-
      - name: Verify and index every published release and candidate
        run: python -I roots-review build
      - name: Integration tests and byte-for-byte determinism
        env:
          ROOTS_REVIEW_DETERMINISM: "1"
        run: python -I run_tests.py --all
